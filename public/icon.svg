<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#FFFFFF" filter="url(#shadow)" />
  <rect x="36" y="36" width="440" height="440" rx="92" fill="#F8FAFC" />

  <!-- Tricolor Accent Bands in Rounded Card -->
  <path d="M 40 160 C 40 91.5 95.5 36 164 36 L 348 36 C 416.5 36 472 91.5 472 160 L 472 170 L 40 170 Z" fill="url(#saffronGrad)" />
  <path d="M 40 342 L 472 342 L 472 352 C 472 420.5 416.5 476 348 476 L 164 476 C 95.5 476 40 420.5 40 352 Z" fill="url(#greenGrad)" />

  <!-- Central Quiz Emblem Circle -->
  <circle cx="256" cy="256" r="140" fill="#FFFFFF" stroke="#000080" stroke-width="8" filter="url(#shadow)" />

  <!-- 24-Spoke Wheel Accent inside border -->
  <g stroke="#000080" stroke-width="2" opacity="0.3">
    <line x1="256" y1="116" x2="256" y2="396" />
    <line x1="116" y1="256" x2="396" y2="256" />
    <line x1="157" y1="157" x2="355" y2="355" />
    <line x1="157" y1="355" x2="355" y2="157" />
  </g>

  <!-- Central Golden Trophy / Quiz Question Motif -->
  <g transform="translate(186, 176) scale(0.28)">
    <!-- Trophy Cup -->
    <path d="M120 40 L380 40 L360 260 C350 340 300 400 250 420 C200 400 150 340 140 260 Z" fill="url(#goldGrad)" stroke="#E65100" stroke-width="14" />
    <!-- Trophy Handles -->
    <path d="M120 80 C40 80 40 220 135 240" fill="none" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" />
    <path d="M380 80 C460 80 460 220 365 240" fill="none" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" />
    <!-- Trophy Base -->
    <rect x="230" y="420" width="40" height="70" fill="url(#goldGrad)" stroke="#E65100" stroke-width="8" />
    <path d="M160 490 L340 490 L360 540 L140 540 Z" fill="#000080" />
    <!-- Star on Trophy -->
    <polygon points="250,140 268,196 326,196 280,230 298,286 250,252 202,286 220,230 174,196 232,196" fill="#FFFFFF" />
  </g>
</svg>
